name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  processing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  ingestion-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ingestion/package-lock.json
      - run: npm ci
      - run: npm run build

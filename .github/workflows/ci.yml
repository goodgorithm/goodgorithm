name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:

jobs:
  processing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  ingestion-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ingestion/package-lock.json
      - run: npm ci
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # placeholder — this job only gates build/typecheck/test, it doesn't
      # need to reach a real API (client.ts just requires the var to be set
      # at all). Needed for both build (Vite inlines it) and test (vitest
      # imports client.ts too, which throws at module load if unset).
      VITE_API_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy-staging:
    needs: [processing-tests, ingestion-build, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          npx -y @railway/cli@latest up --service goodgorithm-ingestion --ci
          npx -y @railway/cli@latest up --service goodgorithm-api --ci
          npx -y @railway/cli@latest up --service goodgorithm-processing --ci

  deploy-production:
    needs: [processing-tests, ingestion-build, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          npx -y @railway/cli@latest up --service goodgorithm-ingestion --ci
          npx -y @railway/cli@latest up --service goodgorithm-api --ci
          npx -y @railway/cli@latest up --service goodgorithm-processing --ci

  # Independent from deploy-staging/deploy-production (Railway) so a web-only
  # failure can't block the backend services deploying, or vice versa.
  deploy-web-staging:
    needs: [web-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://goodgorithm-api-staging.up.railway.app
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web-production:
    needs: [web-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://goodgorithm-api-production.up.railway.app
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

[project]
name = "goodgorithm-processing"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.67",
    "datasketch>=2.0.0",
    "en-core-web-sm",
    "fasttext-wheel>=0.9.2",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.0",
    "spacy>=3.8.15",
    "upstash-redis>=1.7.0",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "pytest>=9.1.1",
    "skl2onnx>=1.19.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
